<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        <title>Stardance - Hack Club</title>
        <link 
        href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap"
        rel="stylesheet"
        
        />
        <link rel="stylesheet" href="styles.css"/>

    </head>

    <body>
        <canvas id="stars-canvas"></canvas>

        <div class="page active" id="page-home">
            <nav class="nav" id="main-nav">
                <button class="nav-btn login" onclick="openModal('signup')">Create Account</button>

            </nav>

            <div class="home-content">
                <div class="planet p1"></div>
                <div class="planet p2"></div>
                <div class="planet p3"></div>

                <div class="home-text">
                    <div class="hackclub-badge">HACKCLUB STARDANCE</div>
                    <h1 class="home-title">
                        Explore<br/>the<span>Moon</span><br/>with NASA
                    </h1>
                    <p class="home-subtitle">
                        Join a cosmic adventure, learn about the Artemis missions, and help engineer the Space Launch System!
                    </p>
                    <button class="letsgo-btn" onclick="goToPage('page-astro')">Let's Go &nbsp;🚀

                    </button>

                </div>

                <div class="home-illustration">
                    <svg 
                    class="rocket-svg"
                    viewBox="0 0 300 420"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    >
                    <ellipse
                    cx="150" cy="220" rx="52" ry="140" fill="#E8EEF8" stroke="#C4D0E8" stroke-width="3"/>
                    <path d="M150 40 C120 80 100 130 98 180 L202 180 C200 130 180 80 150 40Z" fill="#FF6B35" stroke="#c93e00" stroke-width="2"/>
            <circle cx="150" cy="200" r="28" fill="#4ECDC4" stroke="#2aa8a3" stroke-width="3"/>
            <circle cx="150" cy="200" r="18" fill="#a8f4f0" opacity="0.6"/>
            <circle cx="145" cy="198" r="4" fill="#1a1a3e"/>
            <circle cx="158" cy="198" r="4" fill="#1a1a3e"/>
            <path d="M143 207 Q152 213 162 207" stroke="#1a1a3e" stroke-width="2" stroke-linecap="round" fill="none"/>
            <path d="M98 300 L60 370 L98 350Z" fill="#FF6B9D" stroke="#c93e00" stroke-width="2"/>
            <path d="M202 300 L240 370 L202 350Z" fill="#FF6B9D" stroke="#c93e00" stroke-width="2"/>
            <ellipse cx="150" cy="378" rx="30" ry="20" fill="#FFD93D" opacity="0.9"/>
            <ellipse cx="150" cy="388" rx="18" ry="28" fill="#FF6B35" opacity="0.85"/>
            <ellipse cx="150" cy="400" rx="10" ry="20" fill="white" opacity="0.7"/>
            <circle cx="70" cy="100" r="4" fill="#FFD93D"/>
            <circle cx="240" cy="150" r="3" fill="#FFD93D"/>
            <circle cx="55" cy="250" r="5" fill="#A855F7"/>
            <circle cx="260" cy="280" r="4" fill="#4ECDC4"/>

                    </svg>

                </div>

            </div>

        </div>

        <div class="page" id="page=astro">
            <div class="moon-deco"></div>
            <div class="mars-deco"></div>

            <div class="astro-scene">
                <div class="astronaut-wrap">
                    <svg
                    class="astronaut-svg"
                    viewBox="0 0 180 240"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    >
                    <rect 
                    x="52"
                    y="120"
                    width="176"
                    height="90"
                    rx="22"
                    fill="#E8EEF8" stroke="#C4D0E8"
                    stroke-width="3"
                    />
                    <circle
                    
                    cx="90" cy="90" r="52" fill="#E8EEF8" stroke="#C4D0E8" stroke-width="3"/>

                    <ellipse 
                    cx="82"
                    cy="90"
                    rx="36"
                    ry="38"
                    fill="#4ECDC4" opacity="0.85"
                    />

                    <ellipse cx="82" cy="82" rx="10" ry="14" fill="rgba(255,255,255,0.25)"/>
            <circle cx="82" cy="88" r="5" fill="#1a2e5e"/>
            <circle cx="100" cy="88" r="5" fill="#1a2e5e"/>
            <path id="astro-mouth" d="M79 100 Q91 108 103 100" stroke="#1a2e5e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <rect x="20" y="128" width="34" height="56" rx="17" fill="#E8EEF8" stroke="#C4D0E8" stroke-width="2.5"/>
            <rect x="126" y="128" width="34" height="56" rx="17" fill="#E8EEF8" stroke="#C4D0E8" stroke-width="2.5"/>
            <ellipse cx="37" cy="187" rx="16" ry="11" fill="#FF6B35"/>
            <ellipse cx="143" cy="187" rx="16" ry="11" fill="#FF6B35"/>
            <rect x="60" y="200" width="28" height="36" rx="14" fill="#C4D0E8" stroke="#a0aec8" stroke-width="2"/>
            <rect x="92" y="200" width="28" height="36" rx="14" fill="#C4D0E8" stroke="#a0aec8" stroke-width="2"/>
            <ellipse cx="74" cy="236" rx="18" ry="10" fill="#1a2e5e"/>
            <ellipse cx="106" cy="236" rx="18" ry="10" fill="#1a2e5e"/>
            <rect x="112" y="130" width="26" height="40" rx="8" fill="#a0aec8" stroke="#8090b8" stroke-width="2"/>
            <circle cx="78" cy="150" r="10" fill="#FF6B35" opacity="0.7"/>

            <text
            x="78"
            y="154"
            text-anchor="middle"
            fill="white"
            font-size="6"
            font-weight="bold"
            >NASA
        </text>
                
                </svg>

                <div class="sound-wave" id="sound-wave">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>

                </div>

                <div class="voice-controls">
                    <button 
                    class="voice-btn"
                    id="voice-toggle-btn"
                    onclick="toggleSpeech()"
                    >
                    🔊 Listen

                    </button>
                    <button class="replay-btn" onclick="replayVoice()">↺ Replay</button>

                </div>

                <div style="margin-top:10px;display:flex;gap:6px">
                    <div id="dot0" class="bubble-dot active"></div>
                    <div id="dot1" class="bubble-dot"></div>
                    <div id="dot2" class="bubble-dot"></div>
                    <div id="dot3" class="bubble-dot"></div>

                </div>

                </div>

                <div class="speech-bubble-outer">
                    <div class="speech-bubble">
                        <div class="bubble-name">👩‍🚀 Commander Lidika</div>
                        <div class="bubble-text" id="bubble-text">
                            <span id="typed-text"></span>
                            <span class="typing-cursor" id="cursor"></span>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </body>

</html>
